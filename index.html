<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090a10">
  <title>Shaheen TV — Live Sports & Entertainment</title>
  <link rel="icon" href="https://i.postimg.cc/VLqnPCkT/2719095-splash.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="loader" class="loader">
    <div class="loader-image-slot"><img src="https://i.postimg.cc/VLqnPCkT/2719095-splash.png" alt="Shaheen TV Logo"></div>
    <div class="loader-text">Loading Shaheen TV...</div>
    <div class="loader-dots"><span></span><span></span><span></span></div>
  </div>
  <section id="startupFallback" class="startup-fallback" hidden>
    <div class="startup-fallback-card">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <h2>Shaheen TV start nahi ho saki</h2>
      <p data-startup-detail>Internet connection check karke dobara try karein.</p>
      <button type="button" onclick="location.reload()">Reload Website</button>
    </div>
  </section>

  <div class="player-wrapper" id="playerWrapper" hidden>
    <div class="player-section">
      <div class="video-container">
        <video id="video" playsinline controls></video>
        <div class="brand-watermark"><img src="https://bit.ly/Shaheen-TV-logo" alt="Shaheen TV"></div>
        <div id="ov" class="overlay">
          <i class="fa-solid fa-circle-play"></i>
          <p>Select a channel to play</p>
        </div>
      </div>
    </div>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="search" type="search" placeholder="Search countries or channels..." autocomplete="off">
    </div>
    <div class="global-stats" id="globalStats" aria-live="polite">
      <div class="stat-item"><i class="fa-solid fa-earth-americas"></i><span><strong id="totalCountries">0</strong> Countries</span></div>
      <span class="stat-divider"></span>
      <div class="stat-item"><i class="fa-solid fa-tv"></i><span><strong id="totalChannels">0</strong> Total Channels</span></div>
    </div>
  </div>

  <section id="countryChooser">
    <div class="section-label"><i class="fa-solid fa-globe"></i> Choose Country</div>
    <div class="country-bar" id="countryBar"></div>
  </section>
  <section id="countryPage" class="country-page" hidden></section>
  <div class="cat-filter" id="catFilter" hidden></div>
  <main id="list"></main>

  <footer class="app-footer">
    Created with <span class="heart">♥</span> by
    <a class="dev-link" href="https://whatsapp.com/channel/0029VbC00DNGk1FsWn1fqL1j" target="_blank" rel="noopener noreferrer">
      Shaheen TV Developers <i class="fa-brands fa-whatsapp wa-icon"></i>
    </a>
    <span class="footer-line">© 2026 Shaheen TV — All Rights Reserved</span>
  </footer>
  <div id="toast" role="status"></div>

  <script>
    // Independent startup guard: this runs even if an ES module fails to load.
    (function () {
      var loader = document.getElementById('loader');
      var fallback = document.getElementById('startupFallback');
      var showStartupError = function (message) {
        if (loader) loader.classList.add('hide');
        if (fallback) {
          fallback.hidden = false;
          var detail = fallback.querySelector('[data-startup-detail]');
          if (detail) detail.textContent = message || 'Please check your internet connection and reload the website.';
        }
      };
      window.addEventListener('error', function (event) {
        if (event && event.target && event.target !== window) return;
        showStartupError('Website script load nahi ho saka. Hosting par files ka folder structure aur HTTPS link check karein.');
      });
      window.addEventListener('unhandledrejection', function () {
        showStartupError('Website start nahi ho saki. Internet connection check karke dobara try karein.');
      });
      window.setTimeout(function () {
        if (!window.__SHAHEEN_APP_STARTED__) {
          showStartupError('Website ka main script load nahi hua. Vercel par project ki root directory mein index.html aur assets/api folders maujood hone chahiye.');
        } else if (loader) {
          loader.classList.add('hide');
        }
      }, 7000);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
